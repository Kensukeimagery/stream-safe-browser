name: Test result / ผลการทดสอบ
description: Tell us whether it worked for you / บอกว่าใช้ได้หรือไม่
body:
  - type: dropdown
    id: result
    attributes:
      label: Result / ผลลัพธ์
      options: ["Works (no black screen)", "Still black", "Other"]
    validations: { required: true }
  - type: dropdown
    id: browser
    attributes:
      label: Browser / เบราว์เซอร์
      options: ["Microsoft Edge", "Edge Beta/Dev/Canary", "Google Chrome", "Brave", "Vivaldi", "Opera / Opera GX", "Other"]
    validations: { required: true }
  - type: dropdown
    id: popup
    attributes:
      label: Extension popup before the fix / หลังรันทางลัด
      options: ["Before: ON, after: OFF", "Before: ON, after: still ON", "Already OFF before", "Not tested"]
  - type: input
    id: edge
    attributes:
      label: Browser version and Windows version
  - type: input
    id: site
    attributes:
      label: Site tested (Netflix, Disney+, ...)
  - type: textarea
    id: notes
    attributes:
      label: Notes (extension popup status, edge://gpu "PlayReady Hardware DRM disabled", Discord settings)
